[package]
name = "jp-docs-studio-desktop"
version = "0.1.0"
description = "jp-docs Studio のデスクトップ版"
edition = "2021"
license = "MIT"

[lib]
name = "jp_docs_studio_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
getrandom = "=0.2.17"
